version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secondself_db}
      POSTGRES_USER: ${POSTGRES_USER:-secondself_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secondself_pass}
    ports:
      - "${POSTGRES_PORT:-5488}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secondself_user} -d ${POSTGRES_DB:-secondself_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3066:3066"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondself_user}:${POSTGRES_PASSWORD:-secondself_pass}@postgres:5432/${POSTGRES_DB:-secondself_db}
      PRISMA_DATABASE_URL: postgresql://${POSTGRES_USER:-secondself_user}:${POSTGRES_PASSWORD:-secondself_pass}@postgres:5432/${POSTGRES_DB:-secondself_db}
      JWT_SECRET: ${JWT_SECRET:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@example.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-changeme123}
    volumes:
      # Bind-mount the host's ./public/uploads directory into the container so
      # that uploaded avatar images:
      #   1. Survive `docker-compose down && docker-compose up` (no rebuild).
      #   2. Survive `docker-compose down && docker-compose up --build` because
      #      the files live on the host filesystem, not inside the image layer.
      #   3. Are immediately accessible on the host for inspection or backup.
      # Docker creates ./public/uploads on the host automatically if it does
      # not already exist.  scripts/start.sh ensures the directory is writable
      # by the container's node user at runtime.
      # The /api/uploads/[filename] route reads files from this directory at
      # request time, so no static-manifest rebuild is required after uploads.
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
